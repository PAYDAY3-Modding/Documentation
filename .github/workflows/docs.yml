name: Build Antora Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore contributor metadata
        uses: actions/cache@v4
        with:
          path: .cache/contributors.json
          key: contributors-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: contributors-${{ runner.os }}-${{ github.repository_id }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build documentation
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: antora-site
          path: build/site
