name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore contributor metadata
        uses: actions/cache@v4
        with:
          path: .cache/contributors.json
          key: contributors-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: contributors-${{ runner.os }}-${{ github.repository_id }}-

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
