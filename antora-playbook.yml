antora:
  extensions:
    - require: ./scripts/link-previews.js
    - require: ./scripts/contributors.js

site:
  title: PAYDAY 3 Modding Documentation
  url: https://payday3-modding.github.io/Documentation
  start_page: payday3-modding::index.adoc
  keys:
    social-description: Community guides for installing and creating PAYDAY 3 mods with the custom Unreal Engine editor, CrimeFactory, and PDML.
    social-image: /payday3-modding/_images/CrimeFactory-dashboard.png
    social-image-alt: CrimeFactory dashboard showing PAYDAY 3 mods and Forge controls.

content:
  sources:
    - url: .
      branches: HEAD

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site
